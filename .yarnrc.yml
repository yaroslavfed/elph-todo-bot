compressionLevel: mixed

enableGlobalCache: false

enableStrictSsl: false

httpRetry: 3

networkConcurrency: 1

nodeLinker: node-modules

npmAuditRegistry: "https://registry.yarnpkg.com"

npmRegistryServer: "http://nexus.eltex.loc:8081/repository/npm-proxy"

npmScopes:
  elph:
    npmRegistryServer: "https://nexus.eltex.loc:8443/repository/npm-elph/"

unsafeHttpWhitelist:
  - "*nexus.eltex.loc*"
